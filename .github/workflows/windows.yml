name: Windows build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure stable Rust and the Windows shader compiler
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=stable" >> $env:GITHUB_ENV
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $fxc = Get-ChildItem "$sdk\*\x64\fxc.exe" | Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (!$fxc) { throw "Windows SDK shader compiler missing from $sdk" }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV

      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test the simulation
        run: cargo test --release --locked
      - name: Build the game
        run: cargo build --release --locked

      - name: Package and verify the Windows download
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
            $package = $metadata.packages | Where-Object name -eq 'dead-letter'
            if ($env:GITHUB_REF_NAME -cne "v$($package.version)") { throw "Tag must match the dead-letter Cargo version" }
          }
          $zip = 'dead-letter-windows-x64.zip'
          Compress-Archive -Path target/release/dead-letter.exe, README.md -DestinationPath $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/package-check"
          $original = (Get-FileHash target/release/dead-letter.exe).Hash
          $extracted = (Get-FileHash "$env:RUNNER_TEMP/package-check/dead-letter.exe").Hash
          if ($extracted -ne $original) { throw 'Packaged executable differs from release build' }
          "$((Get-FileHash $zip).Hash.ToLowerInvariant())  $zip" | Set-Content "$zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dead-letter-windows-x64.zip
            dead-letter-windows-x64.zip.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check dead-letter-windows-x64.zip.sha256
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${flags[@]}" dead-letter-windows-x64.zip dead-letter-windows-x64.zip.sha256
